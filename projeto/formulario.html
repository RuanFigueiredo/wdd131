<head>

   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="scripts/hamburgueria-chique.js" defer></script>
    <title>Hamburgueria Chique</title>
</head>
<body>
    <header>
        
        <nav class="nav-menu">
            <button id="hamburguer-button" class="hamburguer-button" aria-label="Menu-Principal" aria-controls="menu" aria-expanded="true">
                &#9776;
            </button>

            <ul id="menu" class="menu" aria-hidden="false">
                <li><a href="pagina-inicial.html">Página Inicial</a></li>
                <li><a href="cardapio.html">Cardápio</a></li>
                <li><a href="formulario.html">informações/sugestões</a></li>
            </ul>
    </nav>
    </header>
     <header>
        <h1>Avaliação do Produto</h1>
    </header>

    <main>
        <form action="avaliacao.html" method="get">
            <label for="nome-produto">Nome do Produto:</label>
            <select name="nome-produto" id="nome-produto" required>
                <option value="" disabled selected>Selecione um produto...</option>
            </select>
            <div class="form-group">
                <label for="star1">Classificação Geral</label>
                <div>
                    <input type="radio" id="star1" name="classificacao" value="1" required>
                    <label for="star1">&star;</label>
                </div>
                <div>
                    <input type="radio" id="star2" name="classificacao" value="2" required>
                    <label for="star2">&star;&star;</label>
                </div>
                <div>
                    <input type="radio" id="star3" name="classificacao" value="3" required>
                    <label for="star3">&star;&star;&star;</label>
                </div>
                <div>
                    <input type="radio" id="star4" name="classificacao" value="4" required>
                    <label for="star4">&star;&star;&star;&star;</label>
                </div>
                <div>
                    <input type="radio" id="star5" name="classificacao" value="5" required>
                    <label for="star5">&star;&star;&star;&star;&star;</label>
                </div>
                <label for="data-instalacao">Data da Visita</label>
                <input type="date" id="data-visita" name="data-visita" required>

                <label>O que você mais gostou hoje??<em>(Marque todos que se aplicam)</em></label><br>

                <input type="checkbox" id="recurso1" name="recurso" value="Durabilidade">
                <label for="recurso1">Textura</label><br>

                <input type="checkbox" id="recurso2" name="recurso" value="Facilidade de Uso">
                <label for="recurso2">Sabor</label><br>

                <input type="checkbox" id="recurso3" name="recurso" value="Desempenho">
                <label for="recurso3">Higiene</label><br>

                <input type="checkbox" id="recurso4" name="recurso" value="Design">
                <label for="recurso4">Design</label><br>

                <label for="avaliacao-escrita">Avaliação Escrita (Opcional)</label>
                <textarea id="avaliacao-escrita" name="avaliacao-escrita"></textarea>

                <label for="nome-usuario">Seu nome(opcional)</label>
                <input type="text" id="nome-usuario" name="nome-usuario">
                
                <input type="submit" value="Publicar Avaliação">
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; <span id="anoAtual"></span> - Ruan Figueiredo.</p>
        <p id="ultimaModificacao">última modificação: <span id="dataModificacao"></span></p>
    </footer>
</body>
</html>
